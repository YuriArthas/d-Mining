ke="#ffd46c" stroke-width="4"/><text x="100" y="738" font-size="17">Central 16 x 16m shaft stays clear. Perimeter aisles connect all functions.</text><text x="100" y="767" font-size="17">Amber circle: automatic sale. Teal: teleport arrival. No upgrade shop on this floor.</text></g></svg>