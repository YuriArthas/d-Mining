<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111c29" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Mining</title>
    <!-- mining-boot-instrumentation -->
    <!-- mining-loading-styles -->
    <style>
      html,body{margin:0;width:100%;height:100%;background:#0d202e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      :root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
      .boot-loading,.boot-loading *{box-sizing:border-box}
      .boot-exit{text-decoration:none;border:1px solid #799fa74a;background:#14313d;color:#c2d9d7;border-radius:8px;padding:9px 13px;font-size:12px}
      .boot-exit span{margin-left:15px;color:#e3bd77}
      .boot-loading [hidden]{display:none!important}
      .boot-loading .loading-track>span{width:100%;opacity:.35;animation:boot-breathe 1.8s ease-in-out infinite}
      @keyframes boot-breathe{50%{opacity:.8}}
    </style>
  </head>
  <body>
    <div id="root">
      <section class="loading-screen boot-loading" aria-label="正在加载 Mining">
        <div class="loading-topline"><span>MINING <b>·</b> 矿场</span><a class="boot-exit" href="../../">退出游戏 <span aria-hidden="true">↗</span></a></div>
        <div class="loading-content">
          <!-- mining-loading-emblem -->
          <div class="loading-eyebrow">向下探索 · 满载而归</div>
          <h1>MINING</h1>
          <div class="loading-status" role="status" aria-live="polite">
            <h2 id="boot-status">正在进入矿场…</h2>
            <p id="boot-detail" class="loading-error" hidden></p>
          </div>
          <div id="boot-busy">
            <div class="loading-track" role="progressbar" aria-label="正在进入矿场"><span></span></div>
            <div class="loading-detail"><span>准备出发</span><span>请稍候</span></div>
            <ol class="loading-steps"><li><span>01</span>矿场资源</li><li><span>02</span>附近地形</li><li><span>03</span>场景布置</li><li><span>04</span>画面准备</li></ol>
          </div>
          <button id="boot-retry" class="loading-retry" type="button" hidden>重新加载</button>
          <noscript><p>请开启 JavaScript 后进入游戏。</p></noscript>
        </div>
        <div class="loading-bottom"><span class="loading-tip">挖满背包后，前往收购处换取金币。</span><span>探索 · 采集 · 成长</span></div>
      </section>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
