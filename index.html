<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a6fc4" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>掘矿大师</title>
    <!-- mining-boot-instrumentation -->
    <!-- mining-loading-styles -->
    <style>
      html,body{margin:0;width:100%;height:100%;background:#0a6fc4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      :root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
      .boot-loading,.boot-loading *{box-sizing:border-box}
      .boot-loading [hidden]{display:none!important}
      .boot-loading .loading-track>span{width:100%;opacity:.35;animation:boot-breathe 1.8s ease-in-out infinite}
      @keyframes boot-breathe{50%{opacity:.8}}
    </style>
  </head>
  <body>
    <div id="root">
      <section class="loading-screen boot-loading" aria-label="正在加载掘矿大师" data-msg-label="boot.loading_mining">
        <div class="loading-topline"><span><i data-msg="boot.game_name">掘矿大师</i> <b>·</b> <i data-msg="boot.mine">矿场</i></span><a class="boot-exit" href="../../"><i data-msg="boot.exit">退出游戏</i> <span aria-hidden="true">↗</span></a></div>
        <div class="loading-content">
          <!-- mining-loading-emblem -->
          <div class="loading-eyebrow" data-msg="boot.dig_down_haul_it_home">向下探索 · 满载而归</div>
          <h1 data-msg="boot.game_name">掘矿大师</h1>
          <div class="loading-status" role="status" aria-live="polite">
            <h2 id="boot-status" data-msg="boot.entering_the_mine">正在进入矿场…</h2>
            <p id="boot-detail" class="loading-error" hidden></p>
          </div>
          <div id="boot-busy">
            <div class="loading-track" role="progressbar" aria-label="正在进入矿场" data-msg-label="boot.entering_mine_label"><span></span></div>
            <div class="loading-detail"><span data-msg="boot.getting_ready">准备出发</span><span data-msg="boot.one_moment">请稍候</span></div>
            <ol class="loading-steps"><li><span>01</span><i data-msg="boot.mine_assets">矿场资源</i></li><li><span>02</span><i data-msg="boot.nearby_ground">附近地形</i></li><li><span>03</span><i data-msg="boot.scenery">场景布置</i></li><li><span>04</span><i data-msg="boot.graphics">画面准备</i></li></ol>
          </div>
          <button id="boot-retry" class="loading-retry" type="button" hidden data-msg="boot.reload">重新加载</button>
          <noscript><p>Please turn on JavaScript to play. 请开启 JavaScript 后进入游戏。</p></noscript>
        </div>
        <div class="loading-bottom"><span class="loading-tip" data-msg="boot.tip_when_your_bag_is_full_tap_sell_to_teleport_and_sell_your_ore">小提示：背包满了点「出售」，一键传送去卖矿。</span><span data-msg="boot.explore_gather_grow">探索 · 采集 · 成长</span></div>
      </section>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
